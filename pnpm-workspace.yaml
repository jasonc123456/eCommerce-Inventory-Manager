packages:
  - apps/*
  - packages/*

# Install-time lifecycle scripts are denied by default and allowed only by name
# (section 26, D-119). Every entry is a package whose script we have reviewed and
# require. Note this is pnpm 11's key; `onlyBuiltDependencies` is the legacy
# spelling and is no longer enforced.
allowBuilds:
  # Downloads and links the platform-native esbuild binary. tsx and Vitest
  # cannot run without it.
  esbuild: true
  # Installs the Git hooks binary for this repository.
  lefthook: true
  # Downloads the platform-native libvips binary. Next.js uses it to optimize
  # images at build time and falls back to a much slower path without it.
  sharp: true

# Forced versions for transitive dependencies with published advisories
# (section 24: "dependency intake checks ... before merge/release").
#
# An override is the honest remediation for a vulnerable package three levels
# down that its parent has not yet bumped: it fixes the tree rather than
# silencing the scanner. Each entry is a floor, not a pin, so the ordinary
# grouped Dependabot update still moves them forward — and each is removed once
# the direct dependency ships a version that resolves above it on its own.
overrides:
  # GHSA-r28c-9q8g-f849. Reached through next; a parsing issue in a package that
  # processes stylesheets at build time.
  "postcss@<8.5.18": ">=8.5.18"
  # GHSA-2v37-7h3g-55p8. Reached through vite, which reaches it through postcss,
  # so this one resolves alongside the entry above on most trees. Kept explicit
  # because "resolves on most trees" is not a guarantee.
  "nanoid@<3.3.17": ">=3.3.17"
  # GHSA-f88m-g3jw-g9cj. libvips issues inherited by sharp, which Next.js uses
  # to optimize images at build time. Not on any request path in this
  # application — nothing here processes an uploaded image — but a build-time
  # dependency that decodes untrusted bytes is still a dependency that decodes
  # untrusted bytes.
  "sharp@<0.35.0": ">=0.35.0"

# Single source of truth for third-party versions across the workspace.
# Packages reference these with "catalog:" so a core runtime version can never
# be duplicated by accident (D-114, section 26).
catalog:
  # Runtime
  next: 16.2.12
  react: 19.2.8
  react-dom: 19.2.8
  zod: 4.4.3
  drizzle-orm: 0.45.2
  pg: 8.22.0
  pino: 10.3.1
  pino-pretty: 13.1.3
  prom-client: 15.1.3
  nodemailer: 9.0.3

  # Identity (M1). WebAuthn assertion and attestation verification, and the
  # TOTP algorithm, are both specifications with sharp edges that a hand-rolled
  # implementation gets subtly wrong; everything around them in section 20 is
  # ours.
  "@simplewebauthn/server": 13.3.2
  "@simplewebauthn/browser": 13.3.0
  otpauth: 9.5.1

  # Queue candidates under V-06 benchmark. Both stay in the catalog until
  # ADR-0003 records the winner; the loser is then removed.
  graphile-worker: 0.17.3
  pg-boss: 12.26.4

  # Build and quality
  typescript: 6.0.3
  eslint: 10.8.1
  "@eslint/js": 10.0.1
  typescript-eslint: 8.67.0
  prettier: 3.9.6
  eslint-config-prettier: 10.1.8
  eslint-plugin-jsx-a11y: 6.10.2
  eslint-plugin-react: 7.37.5
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-promise: 7.3.0
  eslint-plugin-security: 4.0.1
  "@next/eslint-plugin-next": 16.2.12

  # Test
  vitest: 4.1.10
  "@vitest/coverage-v8": 4.1.10
  fast-check: 4.9.0
  # The browser tier (D-116). This version has to stay in step with the
  # PLAYWRIGHT_VERSION argument in Dockerfile.e2e: the library refuses to drive a
  # browser build it was not matched with, and the browsers come from the image.
  "@playwright/test": 1.62.1
  # An actual WCAG rule engine, run against the rendered page. The static audit
  # in apps/web can see that a screen has a heading; only this can see that the
  # heading is invisible behind an overlay or that the contrast fails.
  "@axe-core/playwright": 4.13.0
  axe-core: 4.13.0

  # Types
  "@types/node": 24.13.3
  "@types/pg": 8.20.3
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  "@types/nodemailer": 8.0.1

  # Styling
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3

  # Tooling
  drizzle-kit: 0.31.10
  lefthook: 2.1.10
  "@changesets/cli": 2.31.1
  tsx: 4.23.1

# Supply-chain controls (section 26, D-119).
#
# A package published in the last two days cannot enter the lockfile. This is the
# cheapest available defence against a compromised maintainer account, which is
# usually caught and yanked within hours. Raising a version that trips this gate
# is a deliberate act: wait, or add a reviewed exclusion below with a reason.
minimumReleaseAge: 2880
minimumReleaseAgeExclude: []

# Every command here runs non-interactively, including inside the development
# container and CI. Prompting to confirm a node_modules rebuild would just hang.
confirmModulesPurge: false
